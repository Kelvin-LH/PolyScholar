[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "polyscholar"
version = "0.1.0"
description = "Personal local-first academic PDF translation and reading desktop application"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = ["PySide6==6.11.2", "PyMuPDF==1.28.2", "bibtexparser==1.4.4", "rispy==0.10.0", "pyparsing==3.3.2", "keyring==25.6.0"]

[project.optional-dependencies]
mcp = ["mcp==2.3.0"]
build = ["PyInstaller==6.19.0"]

[project.scripts]
polyscholar-cli = "polyscholar.cli:main"
polyscholar-mcp = "polyscholar.mcp_server:main"

[project.gui-scripts]
polyscholar = "polyscholar.app:main"

[tool.setuptools.packages.find]
include = ["polyscholar*", "integrations*"]

[tool.setuptools.data-files]
"share/polyscholar" = ["cli.md", "mcp.md"]
"share/polyscholar/rubrics" = ["rubrics/paper-scoring.md", "rubrics/confidence-scoring.md"]
"share/polyscholar/prompts" = ["prompts/paper-scoring-rubric-prompt.md", "prompts/confidence-scoring-rubric-prompt.md"]
