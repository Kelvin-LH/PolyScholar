[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "polyscholar"
version = "0.1.0"
description = "Personal local-first academic PDF translation and reading desktop application"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = ["PySide6==6.11.2", "PyMuPDF==1.28.2", "keyring==25.6.0"]

[project.optional-dependencies]
build = ["PyInstaller==6.19.0"]
mcp = ["mcp==2.3.0"]

[project.scripts]
polyscholar-cli = "polyscholar.cli:main"
polyscholar-mcp = "polyscholar.mcp_server:main"

[project.gui-scripts]
polyscholar = "polyscholar.app:main"

[tool.setuptools.packages.find]
include = ["polyscholar*", "integrations*"]
