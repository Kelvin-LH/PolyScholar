name: Python baseline
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_baseline.py
      - name: Install pinned local PDF parser for real extraction tests
        run: python -m pip install PyMuPDF==1.28.2
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q polyscholar integrations
  native-gui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux Qt graphics runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - run: python -m pip install -e .
      - name: Start native Qt UI with an isolated temporary library
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m polyscholar --smoke-test
      - name: Check local native workflows with synthetic data
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/smoke_desktop.py
      - name: Check actual local PDF extraction and native evidence workflow
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/smoke_evidence.py
