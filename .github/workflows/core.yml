name: Python baseline
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_baseline.py
      - name: Install pinned local PDF parser for real extraction tests
        run: python -m pip install PyMuPDF==1.28.2
      - name: Install pinned local citation parsers
        run: python -m pip install bibtexparser==1.4.4 rispy==0.10.0 pyparsing==3.3.2
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q polyscholar integrations
  native-gui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux Qt graphics runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - run: python -m pip install -e .
      - name: Start native Qt UI with an isolated temporary library
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m polyscholar --smoke-test
      - name: Check local native workflows with synthetic data
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/smoke_desktop.py
      - name: Check queued dialog completion ownership
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/smoke_managed_io.py
      - name: Check actual local PDF extraction and native evidence workflow
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/smoke_evidence.py
      - name: Check managed PDF attachment identity and native workflows
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/smoke_attachments.py
      - name: Check typed metadata and ordered creator workflows
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/smoke_metadata.py
      - name: Check advanced metadata and dynamic saved searches
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/smoke_searches.py
      - name: Check local current-PDF full-text and source navigation
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/smoke_fulltext.py
      - name: Check recoverable trash and durable purge cleanup
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/smoke_trash.py
      - name: Check duplicate review and explicit bibliographic merging
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/smoke_duplicates.py
      - name: Check fileless bibliography and real primary PDF identity
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/smoke_bibliographic.py
      - name: Check local citation preview and atomic selected import
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/smoke_citation_import.py
      - name: Check local Zotero snapshot preview and selected migration
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/smoke_zotero_migration.py
